name: Scheduled company coverage
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'lib/source-catalog.json'
      - 'lib/catalog.ts'
      - 'lib/scheduled-coverage.ts'
      - 'lib/sources.ts'
      - 'lib/safety.ts'
      - 'scripts/collect-scheduled.mjs'
      - 'scripts/publish-coverage.mjs'
      - 'config/collector-public-key.json'
permissions:
  contents: write
concurrency:
  group: company-lens-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collect the public catalog and encrypt the results
        run: node scripts/collect-scheduled.mjs
      - name: Publish encrypted coverage to its separate branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-coverage.mjs
